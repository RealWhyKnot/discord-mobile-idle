[package]
name = "idlebot"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"

[[bin]]
name = "idlebot"
path = "src/main.rs"

[[bin]]
name = "discord-mobile-idle"
path = "src/bin/discord-mobile-idle.rs"

[dependencies]
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["ws", "webpki-roots", "tokio-rt", "gzip", "brotli", "zstd", "deflate"] }
wreq-util = { version = "=3.0.0-rc.14", default-features = false, features = ["emulation"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
