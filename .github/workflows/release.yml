name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v2026.9.6.0 or v2026.9.6.0-beta'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release_tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ inputs.tag }}
          prerelease-pattern: '^v\d{4}\.\d+\.\d+\.\d+-([A-Fa-f0-9]{4}|beta)$'

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b
        with:
          version: 2.16.03

      - name: Validate
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build the Windows executable
        shell: pwsh
        env:
          IDLEBOT_VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          cargo build --release --locked --bin discord-mobile-idle
          if ($LASTEXITCODE -ne 0) { throw "cargo build exited $LASTEXITCODE" }
          New-Item -ItemType Directory -Force dist/exe | Out-Null
          Copy-Item target/release/discord-mobile-idle.exe dist/exe/

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $exe = 'dist/exe/discord-mobile-idle.exe'
          $log = "$env:LOCALAPPDATA/discord-mobile-idle/self-test.log"
          $run = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "self test exited with $($run.ExitCode)."
          }
          $stamped = Get-Content $log -Raw
          if ($stamped -ne '${{ steps.release_tag.outputs.version }}') { throw "the exe reports version '$stamped'" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.release_tag.outputs.version }}'
          $stage = "dist/stage/discord-mobile-idle-$version"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist/exe/discord-mobile-idle.exe $stage
          Copy-Item README.md, LICENSE $stage
          $zip = "dist/discord-mobile-idle-$version.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "name=$(Split-Path $zip -Leaf)" >> $env:GITHUB_OUTPUT
          "stage=$stage" >> $env:GITHUB_OUTPUT
          "integrity=dist/discord-mobile-idle-$version.integrity.tsv" >> $env:GITHUB_OUTPUT

      - name: Checksums
        id: checksums
        uses: RealWhyKnot/workflows/checksums@v1
        with:
          archives: ${{ steps.package.outputs.zip }}
          contents: ${{ steps.package.outputs.stage }}

      - name: Build release notes
        id: notes
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          title: discord-mobile-idle ${{ steps.release_tag.outputs.tag }}
          extra: |
            ## Downloads

            - `${{ steps.package.outputs.name }}` holds the Windows tray app. Unpack it anywhere and run the exe.
            - The Docker image is built from this repository, see the readme.
            - SHA256 of the zip: `${{ steps.checksums.outputs.sha256 }}`
            - Hashes for every file are in the attached `.integrity.tsv`.

      - name: Create GitHub release
        uses: RealWhyKnot/workflows/publish-release@v1
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          notes-file: ${{ steps.notes.outputs.file }}
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          assets: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.integrity }}

      - name: Roll Unreleased into the released section
        if: steps.release_tag.outputs.prerelease == 'false'
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed ($LASTEXITCODE)" }
          git checkout FETCH_HEAD -- CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed ($LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          & ./.github/scripts/Update-Changelog.ps1 -Mode Promote -Version '${{ steps.release_tag.outputs.tag }}'
          if ($LASTEXITCODE -ne 0) { throw "Update-Changelog.ps1 failed ($LASTEXITCODE)" }

      - name: Commit the rolled changelog
        if: steps.release_tag.outputs.prerelease == 'false'
        uses: RealWhyKnot/workflows/commit-on-branch@v1
        with:
          headline: 'docs(changelog): promote Unreleased to ${{ steps.release_tag.outputs.tag }} [skip changelog]'
          body: Rolled by the release workflow when the tag was published.
          branch: main
          paths: CHANGELOG.md
