name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v2026.9.6.0 or v2026.9.6.0-beta'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release_tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ inputs.tag }}
          prerelease-pattern: '^v\d{4}\.\d+\.\d+\.\d+-([A-Fa-f0-9]{4}|beta)$'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-win.txt -r requirements-dev.txt

      - name: Validate
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest

      - name: Stamp the version
        shell: pwsh
        run: |
          $version = '${{ steps.release_tag.outputs.version }}'
          $line = 'VERSION = "' + $version + '"'
          [System.IO.File]::WriteAllText('idlebot/windows/_version.py', "$line`n", [System.Text.UTF8Encoding]::new($false))
          python -c "import sys; from idlebot.windows._version import VERSION; sys.exit(0 if VERSION == sys.argv[1] else 1)" $version
          if ($LASTEXITCODE -ne 0) { throw "the stamped version did not read back as $version" }

      - name: Build the Windows executable
        run: >
          pyinstaller --onefile --clean --noconfirm --noconsole
          --name discord-mobile-idle --distpath dist/exe --paths . --icon packaging/icon.ico
          --collect-all curl_cffi --collect-all discord_protos
          --collect-submodules discord --collect-submodules pystray
          --hidden-import audioop packaging/entry.py

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $exe = 'dist/exe/discord-mobile-idle.exe'
          $run = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/discord-mobile-idle/self-test.log" -ErrorAction SilentlyContinue
            throw "self test exited with $($run.ExitCode)."
          }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.release_tag.outputs.version }}'
          $stage = "dist/stage/discord-mobile-idle-$version"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist/exe/discord-mobile-idle.exe $stage
          Copy-Item README.md, LICENSE $stage
          $zip = "dist/discord-mobile-idle-$version.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $lines = @("$hash`t$((Get-Item $zip).Length)`t$(Split-Path $zip -Leaf)")
          $integrity = "dist/discord-mobile-idle-$version.integrity.tsv"
          [System.IO.File]::WriteAllLines($integrity, [string[]]$lines, [System.Text.UTF8Encoding]::new($false))
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "name=$(Split-Path $zip -Leaf)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "integrity=$integrity" >> $env:GITHUB_OUTPUT

      - name: Build release notes
        id: notes
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          title: discord-mobile-idle ${{ steps.release_tag.outputs.tag }}
          extra: |
            ## Downloads

            - `${{ steps.package.outputs.name }}` holds the Windows tray app. Unpack it anywhere and run the exe; no Python needed.
            - The Docker image is built from this repository, see the readme.
            - SHA256 of the zip: `${{ steps.package.outputs.sha256 }}`
            - Hashes for every file are in the attached `.integrity.tsv`.

      - name: Create GitHub release
        uses: RealWhyKnot/workflows/publish-release@v1
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          notes-file: ${{ steps.notes.outputs.file }}
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          assets: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.integrity }}
