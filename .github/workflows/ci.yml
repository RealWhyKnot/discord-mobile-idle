name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: repo scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

  rust:
    name: rust fmt + clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  windows:
    name: windows tray app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b
        with:
          version: 2.16.03

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build the tray app
        run: cargo build --release --locked --bin discord-mobile-idle

      - name: Self test
        shell: pwsh
        run: |
          $run = Start-Process -FilePath target/release/discord-mobile-idle.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/discord-mobile-idle/self-test.log" -ErrorAction SilentlyContinue
            throw "self test exited with $($run.ExitCode)."
          }

  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: docker build -t discord-mobile-idle:ci .

      - name: Rejects an empty token
        shell: bash
        run: |
          set +e
          docker run --rm -e DISCORD_TOKEN= discord-mobile-idle:ci
          code=$?
          if [ "$code" != "2" ]; then
            echo "container exited $code, expected 2" >&2
            exit 1
          fi
